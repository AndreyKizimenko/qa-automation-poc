name: QA — Branch run
# What the nightly does, against a branch's code and config. Per tier, the
# nightly gitops sequence (baseline → verify → min → verify → fleetctl checks)
# and then that tier's Playwright suite — so, like the nightly, the suite runs
# against the min config. The tiers are separate instances, so the two chains
# run side by side; each chain runs in order. A tier's suite runs once its
# gitops chain has finished, green or red, as in the nightly: a red gitops step
# still fails the run, and the suite's results come in beside it instead of
# waiting for another dispatch.
#
#   gh workflow run "QA — Branch run" -f branch=<branch>
#   gh workflow run "QA — Branch run" -f branch=main -f workers=<N>   # a worker-count trial, premium's
#   gh workflow run "QA — Branch run" -f branch=<branch> -f os-smokes=true   # with the per-OS smokes
#   gh workflow run "QA — Branch run" -f branch=<branch> -f encryption=true  # with the disk-encryption tests
#
# The per-OS smokes (playwright-os-smokes.yml, after premium's suite) are the
# nightly's: a branch run leaves them out unless `os-smokes` asks for them,
# which a branch that changes them, or what they stand on, does. The same goes
# for the disk-encryption tests (playwright-encryption.yml, after the smokes),
# with `encryption`.
#
# `workers` is premium's count only. Premium has a pool of real VMs per platform
# for its workers to spread over; free has one VM per platform and a smaller
# instance, so it always runs at the count playwright.config.ts gives it. A
# trial of free's count is a dispatch of playwright-free.yml itself.
#
# The branch's gitops config stays applied to the QA instances until the next
# nightly re-applies main's. A branch that changes gitops leaves that change in
# place overnight — say so on its PR.
#
# No concurrency group here: the called workflows hold their instance's group
# (`<tier>-fleetqa-instance`), and a caller in the same group would wait on its
# own callees.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, tag or SHA whose code and config to run
        required: true
        type: string
        default: main
      workers:
        description: Worker count for the premium suite (blank — what playwright.config.ts sets for CI). Free always runs at its own
        required: false
        type: string
        default: ''
      os-smokes:
        description: Also run the per-OS smokes (Playwright — OS smokes) after the premium suite
        required: false
        type: boolean
        default: false
      encryption:
        description: Also run the disk-encryption tests (Playwright — Disk encryption) after the per-OS smokes
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitops-premium:
    uses: ./.github/workflows/nightly-qa-gitops-premium.yml
    with:
      ref: ${{ inputs.branch }}
    secrets: inherit

  playwright-premium:
    needs: gitops-premium
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/playwright-premium.yml
    with:
      ref: ${{ inputs.branch }}
      workers: ${{ inputs.workers }}
    secrets: inherit

  # After premium's suite, whatever it did: the smokes work the same instance
  # and the pool's VMs. Skipped unless the dispatch asked for them.
  playwright-os-smokes:
    needs: playwright-premium
    if: ${{ !cancelled() && inputs.os-smokes }}
    uses: ./.github/workflows/playwright-os-smokes.yml
    with:
      ref: ${{ inputs.branch }}
    secrets: inherit

  # After the smokes, whatever they did, or skipped: both take OS matrix hosts.
  # Skipped unless the dispatch asked for them.
  playwright-encryption:
    needs: [playwright-premium, playwright-os-smokes]
    if: ${{ !cancelled() && inputs.encryption }}
    uses: ./.github/workflows/playwright-encryption.yml
    with:
      ref: ${{ inputs.branch }}
    secrets: inherit

  gitops-free:
    uses: ./.github/workflows/nightly-qa-gitops-free.yml
    with:
      ref: ${{ inputs.branch }}
    secrets: inherit

  playwright-free:
    needs: gitops-free
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/playwright-free.yml
    with:
      ref: ${{ inputs.branch }}
    secrets: inherit

  # How this run's failed and flaky tests fared in the nightlies before it,
  # written to the run's summary: a failure the branch brought is one main's
  # nights never had. Given the one secret it needs, and it never fails the run.
  run-history:
    needs: [playwright-premium, playwright-free, playwright-os-smokes, playwright-encryption]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/run-history.yml
    with:
      ref: ${{ inputs.branch }}
    secrets:
      QA_REPORT_PRIVATE_KEY: ${{ secrets.QA_REPORT_PRIVATE_KEY }}
