name: Playwright — Premium

# Runs the full Playwright suite against the premium Fleet instance — nightly as
# the last step of its tier in `QA — Nightly` (qa-nightly.yml), after that tier's
# gitops chain.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Worker count for the suite (blank — what playwright.config.ts sets for CI)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA whose code and config to use (default — the workflow's own ref)
        required: false
        type: string
        default: ''
      workers:
        description: Worker count for the suite (blank — what playwright.config.ts sets for CI)
        required: false
        type: string
        default: ''

# Shared with nightly-qa-gitops-premium.yml, so a gitops apply and a test run
# never overlap, and one test run waits for another: the real VMs work one
# queue each and the suite's fixtures on them are shared.
concurrency:
  group: premium-fleetqa-instance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    # A guard against a hung run, with room for growth: Playwright stops the
    # main suite at 100 min (globalTimeout), the exclusive specs at 60 and the
    # gitops-mode specs at 15, so a run that uses all of it still merges and
    # uploads its report inside this limit.
    timeout-minutes: 185
    runs-on: ubuntu-26.04
    # Browsers are pre-installed in the image, so we skip `playwright install`
    # entirely — the CDN download from cdn.playwright.dev stalls on hosted runners.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    defaults:
      run:
        # A job-level `defaults` replaces the workflow's, so the shell is set
        # again here — the container would otherwise run steps under `sh`.
        shell: bash
        working-directory: playwright
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - run: npm ci

      - name: Write .env.premium from secrets
        run: |
          cat > .env.premium <<EOF
          FLEET_URL=${{ secrets.FLEET_PREMIUM_URL }}
          FLEET_API_TOKEN=${{ secrets.FLEET_PREMIUM_API_TOKEN }}
          FLEET_ADMIN_EMAIL=${{ secrets.FLEET_PREMIUM_ADMIN_EMAIL }}
          FLEET_ADMIN_PASSWORD=${{ secrets.FLEET_PREMIUM_ADMIN_PASSWORD }}
          FLEET_SSO_LOGIN_USERNAME=${{ secrets.FLEET_SSO_LOGIN_USERNAME }}
          FLEET_SSO_LOGIN_PASSWORD=${{ secrets.FLEET_SSO_LOGIN_PASSWORD }}
          FLEET_TEST_USER_PASSWORD=${{ secrets.FLEET_PREMIUM_TEST_USER_PASSWORD }}
          FLEET_STATIC_USER_PASSWORD=${{ secrets.FLEET_PREMIUM_STATIC_USER_PASSWORD }}
          FLEET_STATIC_TOKEN_API_GLOBAL_ADMIN=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_GLOBAL_ADMIN }}
          FLEET_STATIC_TOKEN_API_GLOBAL_MAINTAINER=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_GLOBAL_MAINTAINER }}
          FLEET_STATIC_TOKEN_API_GLOBAL_OBSERVER=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_GLOBAL_OBSERVER }}
          FLEET_STATIC_TOKEN_API_GLOBAL_OBSERVER_PLUS=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_GLOBAL_OBSERVER_PLUS }}
          FLEET_STATIC_TOKEN_API_GLOBAL_TECHNICIAN=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_GLOBAL_TECHNICIAN }}
          FLEET_STATIC_TOKEN_API_GLOBAL_GITOPS=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_GLOBAL_GITOPS }}
          FLEET_STATIC_TOKEN_API_WS_MAINTAINER=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_WS_MAINTAINER }}
          FLEET_STATIC_TOKEN_API_WS_OBSERVER=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_WS_OBSERVER }}
          FLEET_STATIC_TOKEN_API_WS_MAINT_QA_OBS=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_WS_MAINT_QA_OBS }}
          FLEET_STATIC_TOKEN_API_SPECIFIC_ENDPOINTS_GLOBAL=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_SPECIFIC_ENDPOINTS_GLOBAL }}
          FLEET_STATIC_TOKEN_API_SPECIFIC_ENDPOINTS_WS=${{ secrets.FLEET_PREMIUM_STATIC_TOKEN_API_SPECIFIC_ENDPOINTS_WS }}
          EOF

      # tests/cli/ drives the real fleetctl binary. Match the server version:
      # an older client still runs but prints a version-mismatch banner on every
      # command and can lag behind new output keys.
      # The Playwright image has no jq, so the version is read with sed.
      - name: Install fleetctl matching the server
        env:
          FLEET_URL: ${{ secrets.FLEET_PREMIUM_URL }}
          FLEET_API_TOKEN: ${{ secrets.FLEET_PREMIUM_API_TOKEN }}
        run: |
          set -e
          SERVER_VERSION="$(
            curl -fsSL "$FLEET_URL/api/v1/fleet/version" \
              --header "Authorization: Bearer $FLEET_API_TOKEN" \
              | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' | head -1 || true
          )"
          # An RC server ("4.93.0-rc.…") has no published client of its own: take its
          # release's client once that is published, else the latest release, which is
          # at most a minor behind — a pairing Fleet supports.
          BASE="$(grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' <<< "$SERVER_VERSION" || true)"
          if [ -n "$BASE" ] && npm view "fleetctl@$BASE" version >/dev/null 2>&1; then
            INSTALL_VERSION="$BASE"
          else
            INSTALL_VERSION="latest"
          fi
          npm install -g "fleetctl@$INSTALL_VERSION" || npm install -g fleetctl@latest
          fleetctl --version

      # The main project, the exclusive specs and the gitops-mode specs run as
      # three steps. The exclusive specs flip global switches or need a real VM's
      # queue to themselves, and gitops mode makes every mutating control
      # read-only, so each must run after every parallel spec has finished — but
      # not only when those specs passed: as a Playwright dependency, one
      # unrelated failure would skip them all. Each step writes a blob report to
      # its own directory (the blob reporter clears its directory first), and the
      # last step merges them into the one HTML report. The suite stops itself at
      # 100 min (globalTimeout), the exclusive specs at 60 (13 min measured; two
      # VM specs of up to 20 and 15 min an attempt, each retried once in CI) and
      # the gitops-mode specs at 15, so even a run that uses all of it merges and
      # uploads its report inside the job's 185.
      - name: Run the suite
        id: suite
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/suite
          WORKERS: ${{ inputs.workers }}
        run: SUITE=premium npx playwright test --project=premium --reporter=github,blob

      # Runs whether the suite passed or failed, but not when it never ran (a
      # setup step above failed, or the run was cancelled).
      - name: Run the exclusive specs
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/exclusive
        run: SUITE=premium npx playwright test --project=premium-exclusive --reporter=github,blob --global-timeout=3600000

      - name: Run the gitops-mode specs
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/gitops-mode
        run: SUITE=premium npx playwright test --project=gitops-mode --reporter=github,blob --global-timeout=900000

      - name: Merge the reports
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: |
          mkdir -p blob-report/all
          find blob-report/suite blob-report/exclusive blob-report/gitops-mode -name '*.zip' -exec cp {} blob-report/all/ \; 2>/dev/null || true
          npx playwright merge-reports --reporter html blob-report/all

      # Uploaded on every outcome: a failed or interrupted run is the one whose
      # report matters most.
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: playwright-report-premium
          path: playwright/playwright-report/
          retention-days: 14
