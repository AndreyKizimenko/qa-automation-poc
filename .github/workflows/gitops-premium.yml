name: GitOps — Premium

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA whose code and config to use (default — the workflow's own ref)
        required: false
        type: string
        default: ''
      caller:
        description: Set by being called at all — it tells the concurrency group below that an orchestrator already holds the instance lock
        required: false
        type: string
        default: orchestrator
  # No push/pull_request triggers — gitops only runs from the nightly
  # orchestrator (workflow_call) or manual dispatch.

# An apply deletes whatever its config doesn't declare, a running test's per-run
# items included, so it must never overlap a suite run. Called from the
# orchestrator, that is already guaranteed: the orchestrator holds the instance
# group (`premium-fleetqa-instance`, shared with the suite workflow) and this
# workflow takes its own. Dispatched by hand, nothing else holds that lock, so
# the dispatch takes the instance group itself and waits for a running suite.
concurrency:
  group: ${{ inputs.caller && 'gitops-premium' || 'premium-fleetqa-instance' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  apply:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # `fleetctl gitops` reads the gitops-mode exceptions even with the mode off,
      # and a stuck one deletes or refuses what this config declares: the script says how.
      - name: Restore the pinned gitops-mode exceptions
        if: github.event_name != 'pull_request'
        run: .github/scripts/restore-gitops-exceptions.sh
        env:
          FLEET_URL:       ${{ secrets.FLEET_PREMIUM_URL }}
          FLEET_API_TOKEN: ${{ secrets.FLEET_PREMIUM_API_TOKEN }}

      - name: Apply latest configuration to Fleet
        uses: ./.github/gitops-action
        with:
          config-files: |
            gitops/premium-fleetqa/default.yml
            gitops/premium-fleetqa/fleets/workstations.yml
            gitops/premium-fleetqa/fleets/qa.yml
            gitops/premium-fleetqa/fleets/vms.yml
            gitops/premium-fleetqa/fleets/compliance.yml
          dry-run-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        env:
          FLEET_URL:              ${{ secrets.FLEET_PREMIUM_URL }}
          FLEET_API_TOKEN:        ${{ secrets.FLEET_PREMIUM_API_TOKEN }}
          FLEET_SSO_METADATA_URL: ${{ secrets.FLEET_PREMIUM_SSO_METADATA_URL }}
          FLEET_EUA_METADATA_URL: ${{ secrets.FLEET_EUA_METADATA_URL }}
          FLEET_ABM_ORG_NAME:     ${{ secrets.FLEET_ABM_ORG_NAME }}
          FLEET_VPP_LOCATION:     ${{ secrets.FLEET_VPP_LOCATION }}
