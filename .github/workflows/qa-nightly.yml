name: QA — Nightly
# The nightly as one chain: redeploy both Render instances, give the deploys
# time to finish, then per tier the nightly gitops sequence and that tier's
# Playwright suite — the tier chains `QA — Branch run` runs, against main. Each
# step starts when the one before it ends. A tier's suite runs once its gitops
# chain has finished, green or red: a failed apply or drift check is its own
# signal, and the night's test results still come in.
#
#   Render deploy hooks ─► wait (30 min) + both instances healthy
#     ├─► gitops premium ─► Playwright premium (whatever gitops did)
#     └─► gitops free    ─► Playwright free    (whatever gitops did)
#
# Scheduled for 03:17 UTC (10:17 PM CDT) — off the top of the hour, which GitHub
# documents as its most-delayed slot. GitHub starts scheduled runs late — since
# 2026-08-27 this repo's have been starting 4–6.5 h after their cron time — so it
# lands around 1–4:30 AM Central and is done before morning. The chain doesn't
# mind the lag: every step waits on the one before it, not on a clock. If GitHub
# catches up, it runs at 10 PM Central.
# For a start at an exact time, an outside scheduler can call workflow_dispatch.
#
#   gh workflow run "QA — Nightly"
#
# The tier jobs take no concurrency group of their own: the called workflows
# hold their instance's group (`<tier>-fleetqa-instance`), and a job in the same
# group would wait on its own callees. The chain's own group keeps a second
# chain — a manual run beside the scheduled one — from redeploying the
# instances under a running suite.

on:
  workflow_dispatch:
    inputs:
      render-wait-minutes:
        description: Minutes to let the Render deploys finish before gitops starts (only without Render API credentials)
        type: number
        default: 30
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC = 10:17 PM CDT (9:17 PM CST); GitHub starts it hours late

concurrency:
  group: qa-nightly-chain
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  render-deploy:
    uses: ./.github/workflows/render-deploy.yml
    secrets: inherit

  # A deploy hook only queues the deploy, and Render keeps the old instance
  # serving until the new one is live, so the instance answering says nothing
  # about the deploy being done. Render's API does: with RENDER_API_KEY and the
  # two service ids set, the wait polls each service's newest deploy until it is
  # live, and fails on a failed or cancelled one — the case the instance itself
  # never reports. Without them it is the fixed wait. The health check after it
  # catches an instance that came up broken, and the build report records which
  # build the night is actually testing. It runs even if a hook failed: that
  # instance simply wasn't redeployed, and the night still runs.
  # Past this point each job checks render-settle's result itself, because a
  # job's default `success()` also counts a failed hook further up the chain.
  render-settle:
    needs: render-deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Let the deploys finish
        env:
          WAIT_MINUTES: ${{ inputs.render-wait-minutes || 30 }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PREMIUM_SERVICE_ID: ${{ secrets.RENDER_PREMIUM_SERVICE_ID }}
          FREE_SERVICE_ID: ${{ secrets.RENDER_FREE_SERVICE_ID }}
        run: |
          if [[ -z "$RENDER_API_KEY" || -z "$PREMIUM_SERVICE_ID" || -z "$FREE_SERVICE_ID" ]]; then
            echo "No Render API credentials (RENDER_API_KEY, RENDER_PREMIUM_SERVICE_ID, RENDER_FREE_SERVICE_ID): waiting $WAIT_MINUTES min"
            sleep $(( WAIT_MINUTES * 60 ))
            exit 0
          fi
          # The newest deploy of each service is the one the hook just queued; an
          # instance whose hook failed shows its previous, live deploy and passes.
          for tier in premium free; do
            service=$([[ $tier == premium ]] && echo "$PREMIUM_SERVICE_ID" || echo "$FREE_SERVICE_ID")
            for attempt in $(seq 1 60); do
              status="$(curl -fsS --max-time 20 \
                -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' \
                "https://api.render.com/v1/services/$service/deploys?limit=1" \
                | jq -r '.[0].deploy.status // "unknown"' 2>/dev/null || echo unknown)"
              case "$status" in
                live)
                  echo "$tier deploy is live"
                  continue 2 ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "::error::The $tier deploy ended as '$status' — the instance is still serving the previous build"
                  exit 1 ;;
                *)
                  echo "$tier deploy: $status (check $attempt of 60)"
                  sleep 30 ;;
              esac
            done
            echo "::error::The $tier deploy wasn't live after 30 min"
            exit 1
          done

      - name: Both instances are healthy
        env:
          PREMIUM_URL: ${{ secrets.FLEET_PREMIUM_URL }}
          FREE_URL: ${{ secrets.FLEET_FREE_URL }}
        # A URL secret may end in a slash, and Fleet answers a doubled slash with a
        # redirect that `-f` alone counts as success, so the slash is stripped and
        # redirects are followed.
        run: |
          for tier in premium free; do
            url=$([[ $tier == premium ]] && echo "$PREMIUM_URL" || echo "$FREE_URL")
            url="${url%/}"
            for attempt in $(seq 1 30); do
              if curl -fsSL -o /dev/null --max-time 10 "$url/healthz"; then
                echo "$tier is healthy"
                continue 2
              fi
              sleep 30
            done
            echo "::error::The $tier instance isn't healthy 15 min after the deploy wait"
            exit 1
          done

      # Render keeps the previous build serving when a deploy fails, so the run
      # records which build each instance is actually on. A failed read says how
      # it failed (HTTP status, or a body jq couldn't parse) rather than "unknown".
      - name: Report the builds under test
        env:
          PREMIUM_URL: ${{ secrets.FLEET_PREMIUM_URL }}
          FREE_URL: ${{ secrets.FLEET_FREE_URL }}
          PREMIUM_TOKEN: ${{ secrets.FLEET_PREMIUM_API_TOKEN }}
          FREE_TOKEN: ${{ secrets.FLEET_FREE_API_TOKEN }}
        run: |
          for tier in premium free; do
            url=$([[ $tier == premium ]] && echo "$PREMIUM_URL" || echo "$FREE_URL")
            url="${url%/}"
            token=$([[ $tier == premium ]] && echo "$PREMIUM_TOKEN" || echo "$FREE_TOKEN")
            body="$(mktemp)"
            status="$(curl -sSL --max-time 20 -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer $token" "$url/api/latest/fleet/version" || echo curl-failed)"
            if [[ "$status" == "200" ]] && build="$(jq -er '"\(.version) @ \(.revision)"' "$body" 2>/dev/null)"; then
              :
            else
              build="unreadable (HTTP $status; body starts: $(head -c 80 "$body" | tr -d '\n'))"
            fi
            rm -f "$body"
            echo "::notice title=$tier build::$build"
            echo "- **$tier**: \`$build\`" >> "$GITHUB_STEP_SUMMARY"
          done

  gitops-premium:
    needs: render-settle
    if: ${{ !cancelled() && needs.render-settle.result == 'success' }}
    uses: ./.github/workflows/nightly-qa-gitops-premium.yml
    secrets: inherit

  playwright-premium:
    needs: [render-settle, gitops-premium]
    if: ${{ !cancelled() && needs.render-settle.result == 'success' }}
    uses: ./.github/workflows/playwright-premium.yml
    secrets: inherit

  gitops-free:
    needs: render-settle
    if: ${{ !cancelled() && needs.render-settle.result == 'success' }}
    uses: ./.github/workflows/nightly-qa-gitops-free.yml
    secrets: inherit

  playwright-free:
    needs: [render-settle, gitops-free]
    if: ${{ !cancelled() && needs.render-settle.result == 'success' }}
    uses: ./.github/workflows/playwright-free.yml
    secrets: inherit
