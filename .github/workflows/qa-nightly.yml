name: QA — Nightly
# The nightly as one chain: redeploy both Render instances, give the deploys
# time to finish, then per tier the nightly gitops sequence and that tier's
# Playwright suite — the tier chains `QA — Branch run` runs, against main. Each
# step starts when the one before it ends, and a red gitops step stops its
# tier's suite.
#
#   Render deploy hooks ─► wait (30 min) + both instances healthy
#     ├─► gitops premium ─► Playwright premium
#     └─► gitops free    ─► Playwright free
#
# Started at 12 AM Central by an outside scheduler calling this workflow's
# workflow_dispatch: GitHub creates this repo's scheduled runs hours late (4–6.5 h
# since 2026-08-27), so a `schedule:` can't hold a time. The schedule below is a
# fallback for a night the outside trigger doesn't fire: the run stands down
# when a dispatched one already started that UTC day.
#
#   gh workflow run "QA — Nightly"
#
# The tier jobs take no concurrency group of their own: the called workflows
# hold their instance's group (`<tier>-fleetqa-instance`), and a job in the same
# group would wait on its own callees. The chain's own group keeps the fallback
# from starting while a dispatched chain is still running.

on:
  workflow_dispatch:
    inputs:
      render-wait-minutes:
        description: Minutes to let the Render deploys finish before gitops starts
        type: number
        default: 30
  schedule:
    - cron: '0 7 * * *' # fallback only — 2 h after the 12 AM CDT trigger, plus GitHub's lag

concurrency:
  group: qa-nightly-chain
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != schedule ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          dispatched=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/qa-nightly.yml/runs" \
            -f event=workflow_dispatch -f created=">=$today" --jq '.total_count')
          if (( dispatched > 0 )); then
            echo "::notice::A dispatched nightly already started today; the fallback stands down."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No dispatched nightly today; the outside trigger didn't fire, so the fallback runs the chain."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  render-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/render-deploy.yml
    secrets: inherit

  # A deploy hook only queues the deploy, and Render keeps the old instance
  # serving until the new one is live, so the instance answering says nothing
  # about the deploy being done — the wait is what covers it. The health check
  # after it catches an instance that came up broken. It runs even if a hook
  # failed: that instance simply wasn't redeployed, and the night still runs.
  # Past this point each job checks its own dependency's result, because a
  # job's default `success()` also counts a failed hook further up the chain.
  render-settle:
    needs: [gate, render-deploy]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Let the deploys finish
        env:
          WAIT_MINUTES: ${{ inputs.render-wait-minutes || 30 }}
        run: sleep $(( WAIT_MINUTES * 60 ))

      - name: Both instances are healthy
        env:
          PREMIUM_URL: ${{ secrets.FLEET_PREMIUM_URL }}
          FREE_URL: ${{ secrets.FLEET_FREE_URL }}
        run: |
          for tier in premium free; do
            url=$([[ $tier == premium ]] && echo "$PREMIUM_URL" || echo "$FREE_URL")
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null --max-time 10 "$url/healthz"; then
                echo "$tier is healthy"
                continue 2
              fi
              sleep 30
            done
            echo "::error::The $tier instance isn't healthy 15 min after the deploy wait"
            exit 1
          done

  gitops-premium:
    needs: render-settle
    if: ${{ !cancelled() && needs.render-settle.result == 'success' }}
    uses: ./.github/workflows/nightly-qa-gitops-premium.yml
    secrets: inherit

  playwright-premium:
    needs: gitops-premium
    if: ${{ !cancelled() && needs.gitops-premium.result == 'success' }}
    uses: ./.github/workflows/playwright-premium.yml
    secrets: inherit

  gitops-free:
    needs: render-settle
    if: ${{ !cancelled() && needs.render-settle.result == 'success' }}
    uses: ./.github/workflows/nightly-qa-gitops-free.yml
    secrets: inherit

  playwright-free:
    needs: gitops-free
    if: ${{ !cancelled() && needs.gitops-free.result == 'success' }}
    uses: ./.github/workflows/playwright-free.yml
    secrets: inherit
