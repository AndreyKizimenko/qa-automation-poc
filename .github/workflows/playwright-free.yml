name: Playwright — Free

# Runs the Playwright free project (tests/e2e/free + tests/e2e/shared + tests/api outside premium-only trees) against the free Fleet instance.

on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC — 30 min after nightly gitops kicks off at 05:00
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA whose code and config to use (default — the workflow's own ref)
        required: false
        type: string
        default: ''

# Shared with nightly-qa-gitops-free.yml, so a gitops apply and a test run
# never overlap, and one test run waits for another: the real VMs work one
# queue each and the suite's fixtures on them are shared.
concurrency:
  group: free-fleetqa-instance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Browsers are pre-installed in the image, so we skip `playwright install`
    # entirely — the CDN download from cdn.playwright.dev stalls on hosted runners.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    defaults:
      run:
        # A job-level `defaults` replaces the workflow's, so the shell is set
        # again here — the container would otherwise run steps under `sh`.
        shell: bash
        working-directory: playwright
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - run: npm ci

      - name: Write .env.free from secrets
        run: |
          cat > .env.free <<EOF
          FLEET_URL=${{ secrets.FLEET_FREE_URL }}
          FLEET_API_TOKEN=${{ secrets.FLEET_FREE_API_TOKEN }}
          FLEET_ADMIN_EMAIL=${{ secrets.FLEET_FREE_ADMIN_EMAIL }}
          FLEET_ADMIN_PASSWORD=${{ secrets.FLEET_FREE_ADMIN_PASSWORD }}
          FLEET_SSO_LOGIN_USERNAME=${{ secrets.FLEET_SSO_LOGIN_USERNAME }}
          FLEET_SSO_LOGIN_PASSWORD=${{ secrets.FLEET_SSO_LOGIN_PASSWORD }}
          FLEET_TEST_USER_PASSWORD=${{ secrets.FLEET_FREE_TEST_USER_PASSWORD }}
          FLEET_STATIC_USER_PASSWORD=${{ secrets.FLEET_FREE_STATIC_USER_PASSWORD }}
          FLEET_STATIC_TOKEN_API_GLOBAL_ADMIN=${{ secrets.FLEET_FREE_STATIC_TOKEN_API_GLOBAL_ADMIN }}
          FLEET_STATIC_TOKEN_API_GLOBAL_MAINTAINER=${{ secrets.FLEET_FREE_STATIC_TOKEN_API_GLOBAL_MAINTAINER }}
          FLEET_STATIC_TOKEN_API_GLOBAL_OBSERVER=${{ secrets.FLEET_FREE_STATIC_TOKEN_API_GLOBAL_OBSERVER }}
          EOF

      # tests/cli/ drives the real fleetctl binary. Match the server version:
      # an older client still runs but prints a version-mismatch banner on every
      # command and can lag behind new output keys.
      # The Playwright image has no jq, so the version is read with sed.
      - name: Install fleetctl matching the server
        env:
          FLEET_URL: ${{ secrets.FLEET_FREE_URL }}
          FLEET_API_TOKEN: ${{ secrets.FLEET_FREE_API_TOKEN }}
        run: |
          set -e
          SERVER_VERSION="$(
            curl -fsSL "$FLEET_URL/api/v1/fleet/version" \
              --header "Authorization: Bearer $FLEET_API_TOKEN" \
              | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' | head -1 || true
          )"
          # An RC server ("4.93.0-rc.…") has no published client of its own: take its
          # release's client once that is published, else the latest release, which is
          # at most a minor behind — a pairing Fleet supports.
          BASE="$(grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' <<< "$SERVER_VERSION" || true)"
          if [ -n "$BASE" ] && npm view "fleetctl@$BASE" version >/dev/null 2>&1; then
            INSTALL_VERSION="$BASE"
          else
            INSTALL_VERSION="latest"
          fi
          npm install -g "fleetctl@$INSTALL_VERSION" || npm install -g fleetctl@latest
          fleetctl --version

      - run: npm run test:free

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-free
          path: playwright/playwright-report/
          retention-days: 14
