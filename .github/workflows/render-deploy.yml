name: Render — Nightly deploy

# Triggers a redeploy of the Render-hosted Fleet instances so each night's
# gitops runs and suites hit the latest Fleet release. The first step of
# `QA — Nightly` (qa-nightly.yml), which then waits for the deploys to finish;
# a hook only queues its deploy.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  free:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render redeploy (free)
        run: |
          if [[ -z "${{ secrets.RENDER_FREE_DEPLOY_HOOK }}" ]]; then
            echo "::error::Missing secret RENDER_FREE_DEPLOY_HOOK"
            exit 1
          fi
          curl -fsSL -X POST "${{ secrets.RENDER_FREE_DEPLOY_HOOK }}"

  premium:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render redeploy (premium)
        run: |
          if [[ -z "${{ secrets.RENDER_PREMIUM_DEPLOY_HOOK }}" ]]; then
            echo "::error::Missing secret RENDER_PREMIUM_DEPLOY_HOOK"
            exit 1
          fi
          curl -fsSL -X POST "${{ secrets.RENDER_PREMIUM_DEPLOY_HOOK }}"
