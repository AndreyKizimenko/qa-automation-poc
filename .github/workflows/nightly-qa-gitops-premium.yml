name: Nightly QA GitOps — Premium

# Nightly verification chain for the premium instance:
#   1. apply baseline           (gitops-premium.yml — default + workstations + qa + vms + compliance)
#   2. verify baseline          (gitops-verify against no-team, Workstations, QA, VMs and Compliance, parallel)
#   3. apply min variant        (gitops-premium-min.yml — the min default, workstations and compliance, the baseline qa + vms)
#   4. verify min               (gitops-verify against the min no-team, Workstations and Compliance, and QA and VMs again)
#
# QA and VMs are verified in both passes against the same files, since both
# applies carry them: the second pass proves the min apply left them alone.
#
# Test-state cleanup runs inside the Playwright project itself
# (cleanup-setup runs before tests, cleanup-teardown after — see
# `playwright/playwright.config.ts`). No separate gitops reset step.
#
# Runs nightly as a step of `QA — Nightly` (qa-nightly.yml), after the Render
# redeploy; `QA — Branch run` runs it against a branch.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA whose code and config to use (default — the workflow's own ref)
        required: false
        type: string
        default: ''

# Shared with playwright-premium.yml: an apply deletes whatever its config doesn't
# declare, test-run state included, so an apply and a test run never overlap.
concurrency:
  group: premium-fleetqa-instance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  apply-baseline:
    uses: ./.github/workflows/gitops-premium.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  verify-baseline-no-team:
    needs: apply-baseline
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa
    secrets: inherit

  verify-baseline-workstations:
    needs: apply-baseline
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa/fleets/workstations.yml
    secrets: inherit

  verify-baseline-qa:
    needs: apply-baseline
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa/fleets/qa.yml
      label: baseline
    secrets: inherit

  verify-baseline-vms:
    needs: apply-baseline
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa/fleets/vms.yml
      label: baseline
    secrets: inherit

  verify-baseline-compliance:
    needs: apply-baseline
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa/fleets/compliance.yml
    secrets: inherit

  apply-min:
    needs:
      - verify-baseline-no-team
      - verify-baseline-workstations
      - verify-baseline-qa
      - verify-baseline-vms
      - verify-baseline-compliance
    uses: ./.github/workflows/gitops-premium-min.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  verify-min-no-team:
    needs: apply-min
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa-min
    secrets: inherit

  verify-min-workstations:
    needs: apply-min
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa-min/fleets/workstations.yml
    secrets: inherit

  verify-min-qa:
    needs: apply-min
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa/fleets/qa.yml
      label: min
    secrets: inherit

  verify-min-vms:
    needs: apply-min
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa/fleets/vms.yml
      label: min
    secrets: inherit

  verify-min-compliance:
    needs: apply-min
    uses: ./.github/workflows/gitops-verify.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
      gitops-target: gitops/premium-fleetqa-min/fleets/compliance.yml
    secrets: inherit

  # fleetctl checks against the min config just applied: generate-gitops
  # reproduces it, and a dry-run of it proposes no deletions. Must stay inside
  # this chain — the Playwright suite's cleanup-setup drains global reports and
  # policies, after which neither comparison means anything.
  verify-gitops-cli:
    needs:
      - verify-min-no-team
      - verify-min-workstations
      - verify-min-qa
      - verify-min-vms
      - verify-min-compliance
    uses: ./.github/workflows/gitops-nightly-cli.yml
    with:
      ref: ${{ inputs.ref }}
      suite: premium
    secrets: inherit
