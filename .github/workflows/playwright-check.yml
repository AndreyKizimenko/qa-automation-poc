name: Playwright — Check

# Static checks (tsc + eslint) for the Playwright suite, so type or lint
# regressions are caught before merge. It also carries the check that no
# workflow uploads a report in the clear (.github/scripts/check-artifacts.sh):
# that one has to be a required check, and this is the required one.
#
# Runs on EVERY pull request, deliberately — no `paths:` filter. `check` is a
# required status check in main's branch protection, and GitHub treats a
# required context that never reports as pending forever rather than as passed.
# With a path filter, any PR not touching playwright/ (tools/, gitops/, .github/)
# was permanently unmergeable: no job to run, no context reported, and
# enforce_admins leaves no override. Running it unconditionally costs ~1-2
# minutes on unrelated PRs and keeps the branch protection satisfiable.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      # A report holds live credentials and this repository's artifacts are
      # public, so every upload goes through .github/upload-report, encrypted.
      - name: No report leaves CI unencrypted
        working-directory: .
        run: bash .github/scripts/check-artifacts.sh

      - run: npm ci
      - run: npm run check
