agent_options:
  path: ../lib/agent-options.yml

org_settings:
  features:
    enable_host_users: true
    enable_software_inventory: true
    # Extra detail queries, collected with the host's other vitals and returned
    # under `additional` on the host object. Benign reads that reach every host.
    additional_queries:
      time: SELECT * FROM time
      uptime: SELECT total_seconds FROM uptime
    # Stays on: turning it off deletes the history behind the Hosts active chart,
    # and no apply can bring it back. The vulnerabilities dataset is premium.
    historical_data:
      uptime: true
  # The whole section is premium: free declares Fleet's defaults, which the
  # server accepts because nothing changes, and gitops-verify holds it to them.
  fleet_desktop:
    transparency_url: https://fleetdm.com/transparency
    alternative_browser_host: ""
    sso_enabled: false
  activity_expiry_settings:
    activity_expiry_enabled: false
    activity_expiry_window: 30
    preserve_host_activities_on_reenrollment: true
  # Every webhook declared and off, each with the destination it would post to.
  # The specs that exercise a webhook snapshot and restore it, so these are the
  # values they put back. No `policy_ids`: Fleet keeps the live list when the
  # key is omitted.
  webhook_settings:
    interval: 24h0m0s
    activities_webhook:
      enable_activities_webhook: false
      destination_url: https://example.com/fleet/activities
    host_status_webhook:
      enable_host_status_webhook: false
      destination_url: https://example.com/fleet/host-status
      host_percentage: 25
      days_count: 7
    failing_policies_webhook:
      enable_failing_policies_webhook: false
      destination_url: https://example.com/fleet/failing-policies
      host_batch_size: 0
    vulnerabilities_webhook:
      enable_vulnerabilities_webhook: false
      destination_url: https://example.com/fleet/vulnerabilities
      host_batch_size: 0
  # Expire hosts after a day offline so dead osquery-perf simulations are culled
  # rather than accumulating: a deleted simulation never re-enrols on its own.
  # Real fleetd hosts do re-enrol, so the QA VMs come back when powered on.
  host_expiry_settings:
    host_expiry_enabled: true
    host_expiry_window: 1
  org_info:
    contact_url: https://fleetdm.com/company/contact
    org_logo_url_dark_mode: ""
    org_logo_url_light_mode: ""
    org_name: Free QA Automation
  secrets:
    - secret: $FLEET_ENROLL_SECRET
  server_settings:
    ai_features_disabled: false
    deferred_save_host: false
    discard_reports_data: false
    enable_analytics: false
    live_reporting_disabled: false
    report_cap: 0
    scripts_disabled: false
    server_url: $FLEET_URL
  sso_settings:
    enable_sso: true
    enable_sso_idp_login: false
    entity_id: fleet
    idp_image_url: ""
    idp_name: Okta
    metadata_url: $FLEET_SSO_METADATA_URL

controls:
  windows_enabled_and_configured: true
  # Android MDM was turned on in the UI; the server ignores this key on a
  # config write, so it records the assumption and gitops-verify reads it back.
  android_enabled_and_configured: true
  scripts:
    - path: ../lib/platforms/macos/scripts/toggle-fleetd-debug.sh
    - path: ../lib/platforms/macos/scripts/uninstall-fleetd-macos.sh
    - path: ../lib/platforms/macos/scripts/update-safari.sh
    - path: ../lib/platforms/windows/scripts/create-admin-user.ps1
    - path: ../lib/platforms/windows/scripts/enable-ms-defender.ps1
    - path: ../lib/platforms/windows/scripts/hide-windows-insider-settings-page.ps1
    - path: ../lib/platforms/windows/scripts/toggle-fleetd-debug.ps1
    - path: ../lib/platforms/windows/scripts/uninstall-fleetd-windows.ps1
    - path: ../lib/platforms/windows/scripts/uninstall-zoom.ps1
    # A glob, relative to this file like `path:` is. Fleet keeps the .sh, .py
    # and .ps1 matches, so a new script dropped into that folder joins the scope
    # on the next apply without an edit here.
    - paths: ../lib/platforms/linux/scripts/*.sh
  apple_settings:
    configuration_profiles:
      - path: ../lib/platforms/macos/configuration-profiles/date-time.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/disable-bluetooth-file-sharing.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/disable-content-caching.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/disable-guest-account.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/disable-internet-sharing.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/disable-media-sharing.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/enable-firewall-logging.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/enable-gatekeeper.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/firewall.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/limit-ad-tracking.mobileconfig
      - path: ../lib/platforms/macos/configuration-profiles/prevent-autologon.mobileconfig
  windows_settings:
    configuration_profiles:
      - path: ../lib/platforms/windows/configuration-profiles/advanced-powershell-logging.xml
      - path: ../lib/platforms/windows/configuration-profiles/bluetooth-settings.xml
      - path: ../lib/platforms/windows/configuration-profiles/disable-game-dvr.xml
      - path: ../lib/platforms/windows/configuration-profiles/disable-guest-account.xml
      - path: ../lib/platforms/windows/configuration-profiles/disable-onedrive.xml
      - path: ../lib/platforms/windows/configuration-profiles/disable-remote-assistance.xml
      - path: ../lib/platforms/windows/configuration-profiles/disable-spotlight.xml
      - path: ../lib/platforms/windows/configuration-profiles/enable-firewall.xml
      - path: ../lib/platforms/windows/configuration-profiles/enable-smartscreen.xml
      - path: ../lib/platforms/windows/configuration-profiles/windows-defender-compliance.xml
  android_settings:
    configuration_profiles:
      - path: ../lib/platforms/android/configuration-profiles/disable-camera.json
      - path: ../lib/platforms/android/configuration-profiles/disable-screen-capture.json

