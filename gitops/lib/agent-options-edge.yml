# Agent options for premium's device-lab fleets, VMs and OS matrix: the same
# osquery config as agent-options.yml, plus fleetd's `edge` update channel for
# all three components. The lab's real hosts run fleetd's pre-release builds,
# so the nightly's suite, per-OS smokes and disk-encryption tests smoke-test
# each fleetd build before it reaches `stable`.
#
# - Premium only: Fleet refuses `update_channels` without a Premium license
#   (`server/fleet/agent_options.go`), so free's global options can't carry it,
#   and free's VMs run the channel their fleetd package was built with.
# - A host moved to a fleet that declares no channels (a throwaway `pw-*`
#   fleet, which copies the global options; Workstations; Unassigned) stays on
#   edge: Fleet sends orbit no channels for such a fleet, and orbit keeps the
#   last ones it was sent (`orbit/cmd/orbit/orbit.go`, serverOverridesRunner).
#   Only a fleet declaring `stable` (Compliance, which holds no hosts) would
#   move a host back.
# - Changing a channel restarts orbit on every host of the fleet, and it then
#   updates to that channel's build: change it only when no run is going.
#
# Keep `config` in step with agent-options.yml.
config:
  options:
    pack_delimiter: /
    logger_tls_period: 10
    distributed_plugin: tls
    disable_distributed: false
    logger_tls_endpoint: /api/osquery/log
    distributed_interval: 10
    distributed_tls_max_attempts: 3
  decorators:
    load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
update_channels:
  orbit: edge
  osqueryd: edge
  desktop: edge
